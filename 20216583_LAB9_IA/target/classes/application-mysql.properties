# MYSQL: 1) ejecutar CODIGO_LAB09.sql en MySQL Workbench;
#        2) editar DB_NAME/CODIGO, DB_USER y DB_PASSWORD segun tu equipo;
#        3) arrancar con el perfil mysql.
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:stf_games_CODIGO}?serverTimezone=America/Lima&useUnicode=true&characterEncoding=utf8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never
