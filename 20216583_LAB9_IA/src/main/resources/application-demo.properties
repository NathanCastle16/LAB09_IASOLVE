# DEMO: corre sin instalar MySQL y conserva la partida en ./data/stf_puzzle.mv.db
# PARA ENTREGA EN MYSQL: ejecutar CODIGO_LAB09.sql y activar el perfil mysql.
spring.datasource.url=jdbc:h2:file:./data/stf_puzzle;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-demo.sql
